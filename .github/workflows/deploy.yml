name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Chỉ một lần deploy chạy tại một thời điểm; không huỷ lần đang chạy để tránh
# publish dở dang.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Validate, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate question bank
        run: npm run validate:content

      - name: Unit tests
        run: npm run test

      - name: Type check
        run: npm run check

      - name: Build static site
        run: npm run build
        env:
          # GitHub Pages phục vụ app tại /<tên repo>, nên mọi đường dẫn cần tiền tố này.
          BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    name: Deploy
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
